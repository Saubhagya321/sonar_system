server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset files (built by Vite into /assets/) are content-addressed
    # and safe to cache aggressively; index.html must stay uncached so a new
    # deploy's asset URLs are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy /api/* to the combiner-api service on the shared compose network.
    # Combiner's blueprint is mounted at /api/feedback, so the full path must
    # be preserved — proxy_pass without a URI to avoid path rewriting.
    location /api/ {
        proxy_pass http://combiner-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # SPA fallback: react-router owns client-side routing, so any unknown
    # path must serve index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
